<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>{{ title or "tradeLz" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js（需要时用） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

  <style>
    body {
      background: #f5f7fb;
    }
    .navbar-brand {
      font-weight: 600;
      letter-spacing: .5px;
    }
    .card {
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,.05);
      border: none;
    }
    .metric-value {
      font-size: 1.6rem;
      font-weight: 600;
    }
    footer {
      color: #888;
      font-size: 13px;
      margin-top: 40px;
      text-align: center;
    }
  </style>

  {% block head %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">tradeLz</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/train">训练</a>
      <a class="nav-link" href="/milestone-a">回测结果</a>
      <a class="nav-link" href="/docs" target="_blank">API</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  {% block content %}{% endblock %}
</div>

<footer>
  tradeLz · Reinforcement Learning Trading Lab
</footer>

</body>
</html>
