{% extends "_layout.html" %}
{% set title = "训练管理 - tradeLz" %}

{% block content %}

<div class="row g-4">

  <!-- ================= 左侧：启动训练 & 日志 ================= -->
  <div class="col-lg-4">

    <!-- Start Train -->
    <div class="card p-4 mb-4">
      <h5 class="mb-3">🚀 启动训练</h5>

      <form id="f">

        <div class="mb-3">
          <label class="form-label">数据 CSV</label>
          <input class="form-control" name="data" value="data/gongye_fulian_features.csv">
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">股票代码</label>
            <input class="form-control" name="symbol" value="601138">
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">观测模式</label>
            <select class="form-select" name="obs_mode">
              <option value="S" selected>S</option>
              <option value="M">M</option>
              <option value="L">L</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">Phase</label>
            <select class="form-select" name="phase">
              <option value="1">1</option>
              <option value="2" selected>2</option>
            </select>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">Total Steps</label>
            <input class="form-control" name="total_steps" value="300000">
          </div>
        </div>

        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">Seed</label>
            <input class="form-control" name="seed" value="42">
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">初始模型（可选）</label>
            <input class="form-control" name="init_model" placeholder="model_xxx.zip">
          </div>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" name="shield" checked>
          <label class="form-check-label">Action Shield</label>
        </div>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" name="use_vecnorm" checked>
          <label class="form-check-label">VecNormalize</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          ▶ 开始训练
        </button>
      </form>

      <div id="msg" class="mt-3"></div>
    </div>

    <!-- Log Viewer -->
    <div class="card p-4">
      <h5 class="mb-2">📜 训练日志</h5>
      <div class="text-muted mb-2">
        当前任务：<span id="selJob">未选择</span>
      </div>
      <pre id="logBox" style="
        background:#0b0f14;
        color:#9ef01a;
        font-size:12px;
        padding:14px;
        border-radius:10px;
        height:360px;
        overflow:auto;
      ">请选择一个任务查看日志...</pre>
    </div>

  </div>

  <!-- ================= 右侧：Jobs & Models ================= -->
  <div class="col-lg-8">

    <!-- Jobs -->
    <div class="card p-4 mb-4">
      <h5 class="mb-3">🧠 训练任务</h5>

      <div class="table-responsive">
        <table class="table table-hover align-middle" id="jobsTbl">
          <thead class="table-light">
            <tr>
              <th>Job ID</th>
              <th>状态</th>
              <th>更新时间</th>
              <th>日志路径</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Models -->
    <div class="card p-4">
      <h5 class="mb-3">📦 已训练模型</h5>

      <div class="table-responsive">
        <table class="table table-hover align-middle" id="modelsTbl">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>股票</th>
              <th>Obs</th>
              <th>Phase</th>
              <th>Shield</th>
              <th>模型路径</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

</div>

<script>
let selectedJobId = null;

function statusBadge(status){
  const s = (status||"").toLowerCase();
  let cls = "secondary";
  if (s === "done") cls = "success";
  else if (s === "running" || s === "queued") cls = "warning";
  else if (s === "failed") cls = "danger";
  return `<span class="badge bg-${cls}">${status}</span>`;
}

async function refreshLists(){
  // jobs
  const jr = await fetch("/train/jobs/list?limit=50");
  const jd = await jr.json();
  const jobs = jd.items || [];

  const jt = document.querySelector("#jobsTbl tbody");
  jt.innerHTML = jobs.map(j => `
    <tr>
      <td>
        <a href="#" onclick="selectJob('${j.job_id}');return false;">
          ${j.job_id}
        </a>
      </td>
      <td>${statusBadge(j.status)}</td>
      <td class="text-muted">${j.updated_at || ""}</td>
      <td class="text-muted small">${j.log_path || ""}</td>
    </tr>
  `).join("");

  // models
  const mr = await fetch("/train/models/list?limit=50");
  const md = await mr.json();
  const models = md.items || [];

  const mt = document.querySelector("#modelsTbl tbody");
  mt.innerHTML = models.map(m => `
    <tr>
      <td>${m.model_id}</td>
      <td>${m.symbol}</td>
      <td>${m.obs_mode}</td>
      <td>${m.phase}</td>
      <td>${m.shield}</td>
      <td class="text-muted small">${m.model_path}</td>
    </tr>
  `).join("");

  if (selectedJobId){
    refreshLog();
  }
}

async function refreshLog(){
  if(!selectedJobId) return;
  const r = await fetch(`/train/log/${selectedJobId}?tail=400`);
  const t = await r.text();
  document.getElementById("logBox").textContent = t || "(empty)";
}

window.selectJob = async function(jobId){
  selectedJobId = jobId;
  document.getElementById("selJob").textContent = jobId;
  await refreshLog();
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const obj = {};
  for (const [k,v] of fd.entries()) obj[k]=v;

  obj.phase = parseInt(obj.phase);
  obj.total_steps = parseInt(obj.total_steps);
  obj.seed = parseInt(obj.seed);
  obj.shield = fd.get("shield") !== null;
  obj.use_vecnorm = fd.get("use_vecnorm") !== null;

  const res = await fetch("/train/start", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(obj)
  });
  const data = await res.json();
  document.getElementById("msg").innerHTML =
    `<div class="alert alert-info small"><pre class="mb-0">${JSON.stringify(data,null,2)}</pre></div>`;
  if (data.job_id){
    selectJob(data.job_id);
  }
});

setInterval(refreshLists, 3000);
refreshLists();
</script>

{% endblock %}
