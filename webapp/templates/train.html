<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>tradeLz - Train</title>
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 16px; font-family: Arial; }
    .row { display: flex; gap: 12px; }
    .col { flex: 1; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    input, select { padding: 6px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    button { padding: 8px 14px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 6px; border-bottom: 1px solid #eee; font-size: 13px; }
    pre { background: #111; color: #0f0; padding: 10px; border-radius: 8px; overflow-x: auto; max-height: 360px; overflow-y: auto;}
    .badge { padding: 2px 8px; border-radius: 999px; border: 1px solid #ccc; font-size: 12px; }
    .ok { background:#eaffea; border-color:#7ad67a; }
    .run { background:#fff6d8; border-color:#f2c04f; }
    .fail { background:#ffe1e1; border-color:#ff7b7b; }
    .muted { color:#666; font-size:12px; }
    a { color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <h2>Train PPO (Online)</h2>
  <div class="muted">Auto refresh every 3s. Click Job ID to view log.</div>

  <div class="row">
    <div class="col">
      <div class="card">
        <h3>Start Train</h3>
        <form id="f">
          <label>Data CSV</label>
          <input name="data" value="data/gongye_fulian_features.csv"/>

          <label>Symbol</label>
          <input name="symbol" value="601138"/>

          <label>Obs Mode</label>
          <select name="obs_mode">
            <option value="S" selected>S</option>
            <option value="M">M</option>
            <option value="L">L</option>
          </select>

          <label>Phase</label>
          <select name="phase">
            <option value="1">1</option>
            <option value="2" selected>2</option>
          </select>

          <label>Total Steps</label>
          <input name="total_steps" value="300000"/>

          <label>Seed</label>
          <input name="seed" value="42"/>

          <label><input type="checkbox" name="shield" checked/> Shield</label><br/>
          <label><input type="checkbox" name="use_vecnorm" checked/> VecNormalize</label><br/><br/>

          <label>Init Model (optional)</label>
          <input name="init_model" value=""/>

          <button type="submit">Start</button>
        </form>

        <div id="msg"></div>
      </div>

      <div class="card">
        <h3>Log Viewer</h3>
        <div class="muted">Selected Job: <span id="selJob">None</span></div>
        <pre id="logBox">Select a job to view log...</pre>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <h3>Jobs</h3>
        <table id="jobsTbl">
          <tr><th>Job</th><th>Status</th><th>Updated</th><th>Log Path</th></tr>
        </table>
      </div>

      <div class="card">
        <h3>Models</h3>
        <table id="modelsTbl">
          <tr><th>ID</th><th>Symbol</th><th>Obs</th><th>Phase</th><th>Shield</th><th>Model Path</th></tr>
        </table>
      </div>
    </div>
  </div>

<script>
let selectedJobId = null;

function statusBadge(status){
  const s = (status||"").toLowerCase();
  let cls = "";
  if (s === "done") cls = "badge ok";
  else if (s === "running" || s === "queued") cls = "badge run";
  else if (s === "failed") cls = "badge fail";
  else cls = "badge";
  return `<span class="${cls}">${status}</span>`;
}

async function refreshLists(){
  // jobs
  const jr = await fetch("/train/jobs/list?limit=50");
  const jd = await jr.json();
  const jobs = jd.items || [];

  const jt = document.getElementById("jobsTbl");
  jt.innerHTML = `<tr><th>Job</th><th>Status</th><th>Updated</th><th>Log Path</th></tr>` + jobs.map(j => {
    const jobId = j.job_id;
    const upd = j.updated_at;
    const lp = j.log_path || "";
    const st = statusBadge(j.status);
    return `<tr>
      <td><a href="#" onclick="selectJob('${jobId}');return false;">${jobId}</a></td>
      <td>${st}</td>
      <td>${upd}</td>
      <td class="muted">${lp}</td>
    </tr>`;
  }).join("");

  // models
  const mr = await fetch("/train/models/list?limit=50");
  const md = await mr.json();
  const models = md.items || [];

  const mt = document.getElementById("modelsTbl");
  mt.innerHTML = `<tr><th>ID</th><th>Symbol</th><th>Obs</th><th>Phase</th><th>Shield</th><th>Model Path</th></tr>` + models.map(m => {
    return `<tr>
      <td>${m.model_id}</td>
      <td>${m.symbol}</td>
      <td>${m.obs_mode}</td>
      <td>${m.phase}</td>
      <td>${m.shield}</td>
      <td class="muted">${m.model_path}</td>
    </tr>`;
  }).join("");

  // if selected job, refresh log too
  if (selectedJobId){
    await refreshLog();
  }
}

async function refreshLog(){
  if(!selectedJobId) return;
  const r = await fetch(`/train/log/${selectedJobId}?tail=400`);
  const t = await r.text();
  document.getElementById("logBox").textContent = t || "(empty)";
}

window.selectJob = async function(jobId){
  selectedJobId = jobId;
  document.getElementById("selJob").textContent = jobId;
  await refreshLog();
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const obj = {};
  for (const [k,v] of fd.entries()) obj[k]=v;

  obj.phase = parseInt(obj.phase);
  obj.total_steps = parseInt(obj.total_steps);
  obj.seed = parseInt(obj.seed);
  obj.shield = fd.get("shield") !== null;
  obj.use_vecnorm = fd.get("use_vecnorm") !== null;

  const res = await fetch("/train/start", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(obj)
  });
  const data = await res.json();
  document.getElementById("msg").innerHTML = "<pre>"+JSON.stringify(data,null,2)+"</pre>";
  if (data.job_id){
    selectJob(data.job_id);
  }
});

setInterval(refreshLists, 3000);
refreshLists();
</script>

</body>
</html>
